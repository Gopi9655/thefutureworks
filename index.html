<script>
/* responsive helpers via JS media (since no Tailwind) handled in CSS below */
</script>
<style>
/* ── Trust strip ───────────────────────────────────────────── */
.trust-strip-row {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  row-gap: 0;
}
.trust-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--t-ink-mut);
  font-weight: 600;
  font-size: 12.5px;
  white-space: nowrap;
  letter-spacing: .02em;
  padding: 0 18px;
  border-right: 1px solid var(--paper-line);
  line-height: 1;
}
.trust-item:last-child { border-right: none; }

/* ── Hero CTA row ──────────────────────────────────────────── */
.hero-cta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 22px;
}

/* ── Scene visibility ──────────────────────────────────────── */
.hero-scene-mobile { display: none; }
.hero-scene-desktop { display: block; }

/* ── Responsive collapse ───────────────────────────────────── */
@media (max-width: 980px) {
  .home-hero-grid { grid-template-columns: 1fr !important; gap: 14px !important; padding-block: 10px 16px !important; min-height: 0 !important; }
  .home-hero-scene { height: 300px !important; min-height: 260px !important; order: 2; }
  .footer-grid { grid-template-columns: 1fr 1fr !important; }
  .statband { grid-template-columns: repeat(3, 1fr) !important; row-gap: 28px; }
  .cards-3 { grid-template-columns: 1fr 1fr !important; }
  .cards-2 { grid-template-columns: 1fr !important; }
  .job-grid { grid-template-columns: 1fr !important; }
  .job-aside { position: static !important; }
  .clients-grid { grid-template-columns: repeat(3, 1fr) !important; }
}
/* ── Nav collapses to burger before the desktop nav can overflow ── */
@media (max-width: 920px) {
  .nav-desktop, .nav-cta { display: none !important; }
  .nav-burger { display: grid !important; }
}
@media (max-width: 720px) {
  /* swap scenes */
  .hero-scene-desktop { display: none !important; }
  .hero-scene-mobile  { display: block !important; margin-top: 28px; padding-bottom: 8px; }

  /* hero text */
  .home-hero-grid { padding-block: 12px 10px !important; }

  /* CTA: first two side-by-side, third full-width */
  .hero-cta-row { gap: 8px !important; }
  .hero-cta-row > a:last-child,
  .hero-cta-row > button:last-child {
    width: 100% !important;
    justify-content: center !important;
    text-align: center !important;
  }

  /* trust chips on mobile */
  .trust-strip-row { justify-content: flex-start; gap: 7px; }
  .trust-item {
    border-right: none;
    background: rgba(95,168,42,.06);
    border: 1px solid rgba(95,168,42,.20) !important;
    color: var(--t-ink-mut);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 11px;
  }

  /* other grids */
  .cards-3, .cards-2 { grid-template-columns: 1fr !important; }
  .statband { grid-template-columns: 1fr 1fr !important; }
  .statband > * { border-left: none !important; }
  .footer-grid { grid-template-columns: 1fr 1fr !important; }
  .clients-grid { grid-template-columns: 1fr 1fr !important; }

  /* Mobile hero = simplified STATIC visual: freeze spin/pulse above the fold */
  .hero-scene-mobile .spin-slow { animation: none !important; }
  .hero-scene-mobile .pulse-ring { animation: none !important; opacity: .35 !important; }
}
@media (min-width: 721px) { .nav-mobile { display: none !important; } }
</style>
