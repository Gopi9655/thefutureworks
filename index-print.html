<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>thefutureworks — Jobs for your future</title>
<meta name="description" content="Coventry University's own recruitment agency. Find jobs and hire staff across Coventry, Warwickshire and the West Midlands." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />

<style>
/* ============================================================
   PRINT OVERRIDES
   ============================================================ */
@media print {
  @page { size: A4 portrait; margin: 0.7cm; }

  /* Force all colors and backgrounds to print */
  *, *::before, *::after {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  /* Jump all animations to their final (visible) state */
  *, *::before, *::after {
    animation-delay: -99s !important;
    animation-duration: .001s !important;
    animation-iteration-count: 1 !important;
    animation-fill-mode: both !important;
    animation-play-state: running !important;
    transition-duration: 0s !important;
  }

  /* Reveal elements — show all */
  .reveal { opacity: 1 !important; transform: none !important; }

  /* Nav — de-sticky */
  .nav {
    position: static !important;
    background: var(--ink-950) !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    border-bottom: 1px solid var(--line) !important;
  }

  /* Hide UI-only elements */
  .mobile-cta-bar { display: none !important; }
  body { padding-bottom: 0 !important; }

  /* Don't split cards or stat blocks across pages */
  .card, .jobcard, .glass-stat, .glass { break-inside: avoid; }
  .cards-3 > *, .cards-2 > *, .statband > * { break-inside: avoid; }

  /* Page breaks: each major section gets its own page */
  main > section { break-before: page; }
  main > section:first-child { break-before: avoid; }
  footer { break-before: page; }

  /* Hero sizing for print */
  .home-hero-grid {
    min-height: 300px !important;
    padding-block: 20px 28px !important;
    gap: 32px !important;
  }
  .home-hero-scene {
    height: 320px !important;
    min-height: 280px !important;
  }

  /* Restore 3-col grids for print (not mobile-collapsed) */
  .cards-3 { grid-template-columns: repeat(3, 1fr) !important; }
  .cards-2 { grid-template-columns: 1fr 1fr !important; }
  .statband { grid-template-columns: repeat(5, 1fr) !important; }
  .footer-grid { grid-template-columns: 1.6fr 1fr 1fr 1fr !important; }
  .clients-grid { grid-template-columns: repeat(4, 1fr) !important; }
  .job-grid { grid-template-columns: 1fr 360px !important; }
}
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- web components -->
<script src="image-slot.js"></script>

<!-- tweaks shell -->
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- app -->
<script type="text/babel" src="js/ui.jsx"></script>
<script type="text/babel" src="js/data.jsx"></script>
<script type="text/babel" src="js/components.jsx"></script>
<script type="text/babel" src="js/hero.jsx"></script>
<script type="text/babel" src="js/tweaks.jsx"></script>
<script type="text/babel" src="js/pages-home.jsx"></script>
<script type="text/babel" src="js/pages-candidates.jsx"></script>
<script type="text/babel" src="js/pages-employers.jsx"></script>
<script type="text/babel" src="js/pages-vacancies.jsx"></script>
<script type="text/babel" src="js/pages-contact.jsx"></script>
<script type="text/babel" src="js/pages-misc.jsx"></script>
<script type="text/babel" src="js/app.jsx"></script>

<style>
/* responsive collapse (same as index.html) */
@media (max-width: 980px) {
  .home-hero-grid { grid-template-columns: 1fr !important; gap: 14px !important; padding-block: 10px 16px !important; min-height: 0 !important; }
  .home-hero-scene { height: 300px !important; min-height: 260px !important; order: 2; }
  .footer-grid { grid-template-columns: 1fr 1fr !important; }
  .statband { grid-template-columns: repeat(3, 1fr) !important; row-gap: 28px; }
  .cards-3 { grid-template-columns: 1fr 1fr !important; }
  .cards-2 { grid-template-columns: 1fr !important; }
  .job-grid { grid-template-columns: 1fr !important; }
  .job-aside { position: static !important; }
  .clients-grid { grid-template-columns: repeat(3, 1fr) !important; }
}
@media (max-width: 720px) {
  .nav-desktop, .nav-cta { display: none !important; }
  .nav-burger { display: grid !important; }
  .home-hero-scene { height: 240px !important; min-height: 200px !important; }
  .cards-3, .cards-2 { grid-template-columns: 1fr !important; }
  .statband { grid-template-columns: 1fr 1fr !important; }
  .statband > * { border-left: none !important; }
  .footer-grid { grid-template-columns: 1fr 1fr !important; }
  .clients-grid { grid-template-columns: 1fr 1fr !important; }
}
@media (min-width: 721px) { .nav-mobile { display: none !important; } }
</style>

<!-- Auto-print: runs after all Babel scripts, waits for fonts + React paint -->
<script type="text/babel">
(function () {
  setTimeout(function () {
    document.fonts.ready.then(function () {
      setTimeout(function () { window.print(); }, 600);
    });
  }, 900);
})();
</script>
</body>
</html>
